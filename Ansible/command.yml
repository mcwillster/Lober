---
- name: Run a specific command on remote hosts
  hosts: pfsense
  become: no # no sudo on pfSense, will error if "yes"
  tasks:
    - name: Run a specific command
      ansible.builtin.command:
        cmd: "whoami"
      register: command_output  # registers the output of the command
      ignore_errors: yes  # ignore errors if the command fails

    - name: Display command output
      debug:
        var: command_output.stdout  # prints the command's stdout to the console

    - name: Download from Github
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/..." # must be raw link, not blob
        dest: /.../...
        mode: 0755
        backup: yes # copies original file to same directory with .bak tacked onto end

    - name: Copy from Ansible Control Node
      copy:
        src: /.../...
        dest: /.../...
        mode: 0755

